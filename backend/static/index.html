<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beaver prototype</title>
<!--
  Mac prototype client for the /ws protocol in docs/contracts.md: mic, screen sharing,
  mascot voice and cards. Stands in for the iPhone app (WP1) so the idea can be tried on
  a Mac. Open http://localhost:8000/#token=<APP_TOKEN> in desktop Chrome.
-->
<style>
  :root {
    --bg: #f6f5f2; --panel: #fff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e4e2dc;
    --red: #d6001c; --idle: #b9b6ad; --listening: #1f8a4c; --thinking: #6b5bd6;
    --searching: #d08a00; --speaking: #d6001c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1f1f1d; --ink: #f1efe9; --muted: #a09d95; --line: #33322f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  h1 { font-size: 18px; margin: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, select, input { font: inherit; color: inherit; }
  button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
           padding: 6px 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .pill.ok { color: var(--listening); border-color: currentColor; }
  .stage { display: grid; justify-items: center; gap: 10px; padding: 24px 0 8px; }
  #orb { width: 132px; height: 132px; border-radius: 50%; border: none; background: var(--idle);
         box-shadow: 0 0 0 0 transparent; transition: background .2s, transform .15s; touch-action: none; }
  #orb:active { transform: scale(.96); }
  #orb[data-state="listening"] { background: var(--listening); animation: pulse 1.2s infinite; }
  #orb[data-state="thinking"] { background: var(--thinking); animation: pulse 1.6s infinite; }
  #orb[data-state="searching"] { background: var(--searching); animation: pulse .9s infinite; }
  #orb[data-state="speaking"] { background: var(--speaking); animation: pulse .7s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 0%, transparent); }
                     50% { box-shadow: 0 0 0 14px rgb(0 0 0 / .06); } 100% { box-shadow: 0 0 0 0 transparent; } }
  @media (prefers-reduced-motion: reduce) { #orb { animation: none !important; } }
  #label { color: var(--muted); min-height: 1.4em; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; }
  .bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; }
  .you { color: var(--muted); }
  #cards { display: grid; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 4px; }
  .card .kind { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .card .big { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .card .meta { color: var(--muted); }
  .badge { display: inline-block; background: var(--red); color: #fff; border-radius: 6px; padding: 0 6px; font-weight: 600; }
  .verdict-fits { color: var(--listening); } .verdict-tight { color: var(--searching); } .verdict-clash { color: var(--red); }
  #screenThumb { max-width: 160px; border-radius: 8px; border: 1px solid var(--line); display: none; }
  #log { font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); white-space: pre-wrap;
         max-height: 180px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  form { display: flex; gap: 8px; } form input { flex: 1; min-width: 0; border: 1px solid var(--line);
         background: var(--panel); border-radius: 999px; padding: 6px 14px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Beaver prototype</h1>
    <div class="row">
      <span id="conn" class="pill">disconnected</span>
      <select id="mode" title="Voice mode">
        <option value="ptt">Push to talk</option>
        <option value="handsfree">Hands-free (use headphones)</option>
      </select>
      <button id="share">Share screen</button>
      <button id="sendScreen" disabled>Send screen now</button>
    </div>
  </header>

  <section class="stage">
    <button id="orb" data-state="idle" aria-label="Hold to talk"></button>
    <div id="label"></div>
    <div class="hint" id="hint">Click the orb to start. Then hold it, or hold Space, while you talk.</div>
  </section>

  <div class="row"><img id="screenThumb" alt="Last screen frame sent"><span id="screenSummary" class="pill" hidden></span></div>
  <div id="you" class="you"></div>
  <div id="say" class="bubble" hidden></div>
  <div id="cards"></div>

  <form id="textForm"><input id="text" placeholder="Or type a question…" autocomplete="off"><button>Send</button></form>
  <div id="log"></div>
</main>

<script>
"use strict";
const RATE = 24000, CHUNK = 1920; // 80 ms of 24 kHz mono, contracts § Audio
const $ = (id) => document.getElementById(id);
const log = (...a) => { const l = $("log"); l.textContent += a.join(" ") + "\n"; l.scrollTop = l.scrollHeight; };

// Token: from #token=... once, then remembered.
let token = new URLSearchParams(location.hash.slice(1)).get("token");
try {
  if (token) { localStorage.setItem("beaverToken", token); history.replaceState(null, "", location.pathname); }
  else token = localStorage.getItem("beaverToken");
} catch {}
if (!token) token = prompt("APP_TOKEN (from backend/.env)") || "";

let ws, ctx, micNode, screenStream, screenVideo;
let mode = "ptt", talking = false, serverState = "idle", dropAudio = false;
let playing = [], nextTime = 0, releasedAt = 0, firstAudioLogged = true;

// ---------- WebSocket ----------
function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onopen = () => ws.send(JSON.stringify({ type: "hello", token, mode }));
  ws.onclose = (e) => {
    setConn(e.code === 1008 ? "bad token" : "disconnected", false);
    if (e.code === 1008) { try { localStorage.removeItem("beaverToken"); } catch {} return; }
    setTimeout(connect, 1000);
  };
  ws.onmessage = (e) => onMessage(JSON.parse(e.data));
}
const send = (m) => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));
function setConn(text, ok) { $("conn").textContent = text; $("conn").classList.toggle("ok", ok); }

function onMessage(m) {
  switch (m.type) {
    case "ready": setConn(mode === "handsfree" ? "connected · hands-free" : "connected", true); break;
    case "state":
      serverState = m.state; $("label").textContent = m.label || "";
      if (m.state === "listening" && mode === "handsfree") { stopPlayback(); grabScreen("speech"); }
      renderOrb(); break;
    case "transcript": $("you").textContent = "You: " + m.text; log("transcript", JSON.stringify(m.text)); break;
    case "reply":
      dropAudio = false; firstAudioLogged = false;
      $("say").hidden = false; $("say").textContent = m.say; renderCards(m.cards || []); break;
    case "a2ui": log("a2ui", m.messages.length, "messages (rendered from reply.cards here)"); break;
    case "audio": if (!dropAudio) playChunk(m.data); break;
    case "audio_end": break;
    case "screen_ok":
      $("screenSummary").hidden = false;
      $("screenSummary").textContent = m.summary ? "Sees: " + m.summary : "Screen received (not read)";
      log("screen_ok", m.summary || "(no summary)"); break;
    case "error": log("error", m.message); $("label").textContent = m.message; break;
  }
}

// ---------- Audio in ----------
const WORKLET = `class Pcm extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Int16Array(${CHUNK}); this.n = 0; }
  process(inputs) {
    const ch = inputs[0][0]; if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      const s = Math.max(-1, Math.min(1, ch[i]));
      this.buf[this.n++] = s < 0 ? s * 0x8000 : s * 0x7fff;
      if (this.n === this.buf.length) { this.port.postMessage(this.buf.buffer, [this.buf.buffer]); this.buf = new Int16Array(${CHUNK}); this.n = 0; }
    }
    return true;
  }
}
registerProcessor("pcm", Pcm);`;

function ensureCtx() { // needs a user gesture (click, key, submit) before audio can play
  if (!ctx) ctx = new AudioContext({ sampleRate: RATE }); // the browser resamples the mic to 24 kHz
  if (ctx.state === "suspended") ctx.resume();
}

async function startAudio() {
  ensureCtx();
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" })));
  const mic = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
  });
  micNode = new AudioWorkletNode(ctx, "pcm");
  micNode.port.onmessage = (e) => { if (talking || mode === "handsfree") send({ type: "audio", data: b64(e.data) }); };
  ctx.createMediaStreamSource(mic).connect(micNode);
  $("hint").textContent = mode === "handsfree"
    ? "Hands-free: just talk. Talking over the beaver interrupts it."
    : "Hold the orb or Space while you talk. Click the orb while it speaks to stop it.";
  log("mic on at", ctx.sampleRate, "Hz");
}

function b64(buf) {
  const bytes = new Uint8Array(buf); let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

// ---------- Audio out ----------
function playChunk(data) {
  if (!ctx) return;
  const raw = atob(data), n = raw.length >> 1, f = new Float32Array(n);
  for (let i = 0; i < n; i++) { const v = raw.charCodeAt(2 * i) | (raw.charCodeAt(2 * i + 1) << 8); f[i] = (v > 32767 ? v - 65536 : v) / 32768; }
  const buf = ctx.createBuffer(1, n, RATE); buf.copyToChannel(f, 0);
  const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination);
  nextTime = Math.max(nextTime, ctx.currentTime + 0.03);
  src.start(nextTime); nextTime += buf.duration;
  playing.push(src); src.onended = () => { playing = playing.filter((s) => s !== src); renderOrb(); };
  if (!firstAudioLogged && releasedAt) { firstAudioLogged = true; log(`first audio ${((performance.now() - releasedAt) / 1000).toFixed(2)} s after release`); }
  renderOrb();
}

function stopPlayback() {
  dropAudio = true; // contracts § WebSocket: drop audio until the next reply
  for (const s of playing) { try { s.stop(); } catch {} }
  playing = []; nextTime = 0; renderOrb();
}

function renderOrb() {
  const state = playing.length ? "speaking" : talking ? "listening" : serverState;
  $("orb").dataset.state = state;
}

// ---------- Push to talk ----------
async function press() {
  if (!micNode) { await startAudio(); return; }      // first click only turns the mic on
  if (mode === "handsfree") { if (playing.length) { stopPlayback(); send({ type: "interrupt" }); } return; }
  if (talking) return;
  if (playing.length || serverState !== "idle") stopPlayback(); // the first audio frame interrupts server-side
  talking = true; renderOrb(); grabScreen("press");
}
function release() {
  if (!talking) return;
  talking = false; releasedAt = performance.now(); send({ type: "audio_end" }); renderOrb();
}
$("orb").addEventListener("pointerdown", (e) => { e.preventDefault(); press(); });
for (const ev of ["pointerup", "pointerleave", "pointercancel"]) $("orb").addEventListener(ev, release);
addEventListener("keydown", (e) => { if (e.code === "Space" && !e.repeat && document.activeElement !== $("text")) { e.preventDefault(); press(); } });
addEventListener("keyup", (e) => { if (e.code === "Space" && document.activeElement !== $("text")) { e.preventDefault(); release(); } });

$("mode").addEventListener("change", () => {
  mode = $("mode").value; stopPlayback(); talking = false;
  if (ws) { ws.onclose = null; ws.close(); } connect();
  if (micNode) $("hint").textContent = mode === "handsfree" ? "Hands-free: just talk." : "Hold the orb or Space while you talk.";
});

// ---------- Screen ----------
$("share").addEventListener("click", async () => {
  try {
    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 2 }, audio: false });
    screenVideo = Object.assign(document.createElement("video"), { srcObject: screenStream, muted: true });
    await screenVideo.play();
    screenStream.getVideoTracks()[0].onended = () => {
      screenStream = screenVideo = null; clearInterval(ringTimer); ring = []; $("share").textContent = "Share screen"; $("sendScreen").disabled = true; };
    clearInterval(ringTimer); ring = [];
    ringTimer = setInterval(() => { // one frame a second; a still screen adds nothing
      if (!screenVideo.videoWidth) return;
      const f = snap().data;
      if (f !== ring.at(-1)) { ring.push(f); if (ring.length > RING) ring.shift(); }
    }, 1000);
    $("share").textContent = "Sharing ✓"; $("sendScreen").disabled = false;
    log("screen sharing on: a frame goes with each question");
  } catch (e) { log("screen share cancelled:", e.message); }
});
$("sendScreen").addEventListener("click", () => grabScreen("button"));

// Earlier frames kept while sharing, about 1 s apart (screen-clip.md). Warm read_screen on the clip
// fixtures (2026-10-10), median of 3: 0 earlier 3.3 s, 3 earlier 3.7 s, 6 earlier 5.5 s, 9 earlier 4.5 s.
// Even one frame is over the 3 s budget today, so keep the most that adds under ~1 s.
const RING = 3;
let lastGrab = 0, ring = [], ringTimer = 0;
function snap() { // the shared screen now, at most 1280 wide, as base64 JPEG 0.8
  const scale = Math.min(1, 1280 / screenVideo.videoWidth);
  const c = Object.assign(document.createElement("canvas"), {
    width: Math.round(screenVideo.videoWidth * scale), height: Math.round(screenVideo.videoHeight * scale) });
  c.getContext("2d").drawImage(screenVideo, 0, 0, c.width, c.height);
  return { w: c.width, h: c.height, data: c.toDataURL("image/jpeg", 0.8).split(",")[1] };
}
function grabScreen(why) {
  if (!screenVideo || !screenVideo.videoWidth || performance.now() - lastGrab < 1500) return;
  lastGrab = performance.now();
  const f = snap(), recent = ring.at(-1) === f.data ? ring.slice(0, -1) : ring; ring = [];
  let bytes = [f.data, ...recent].reduce((n, d) => n + d.length * 0.75, 0);
  while (recent.length && bytes > 8 << 20) bytes -= recent.shift().length * 0.75; // contract: all images ≤ 8 MB
  $("screenThumb").src = "data:image/jpeg;base64," + f.data; $("screenThumb").style.display = "block";
  send({ type: "screen", mime: "image/jpeg", data: f.data, ...(recent.length && { recent }) });
  log(`screen frame sent (${why}, ${f.w}x${f.h}, ${recent.length} earlier, ${Math.round(bytes / 1024)} KB)`);
}

// ---------- Text ----------
$("textForm").addEventListener("submit", (e) => {
  e.preventDefault(); const t = $("text").value.trim(); if (!t) return;
  ensureCtx(); stopPlayback(); grabScreen("text"); releasedAt = performance.now();
  send({ type: "text", text: t }); $("you").textContent = "You: " + t; $("text").value = "";
});

// ---------- Cards (from reply.cards; the iPhone app renders the a2ui messages instead) ----------
const hm = (iso) => iso ? new Date(iso).toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Zurich" }) : "";
const day = (iso) => iso ? new Date(iso).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "Europe/Zurich" }) : "";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function renderCards(cards) {
  $("cards").innerHTML = cards.map((c) => {
    if (c.kind === "train") return `<div class="card"><div class="kind">Train</div>
      <div class="big">${hm(c.departure)} → ${hm(c.arrival)}</div>
      <div>${esc(c.line)} · ${esc(c.from)} → ${esc(c.to)}</div>
      <div class="meta">${c.platform ? `Platform <span class="badge">${esc(c.platform)}</span> · ` : ""}${c.transfers ? c.transfers + " change(s)" : "direct"}${c.delay_min ? ` · <span class="verdict-clash">+${c.delay_min} min</span>` : ""}</div></div>`;
    if (c.kind === "conflict") return `<div class="card"><div class="kind">Plan check · <span class="verdict-${esc(c.verdict)}">${esc(c.verdict)}</span></div>
      <div><b>${esc(c.event?.title)}</b> ${day(c.event?.start)} ${hm(c.event?.start)}–${hm(c.event?.end)}</div>
      <div><b>${esc(c.proposal?.title)}</b> ${day(c.proposal?.start)} ${hm(c.proposal?.start)}${c.proposal?.place ? " · " + esc(c.proposal.place) : ""}</div>
      ${c.note ? `<div class="meta">${esc(c.note)}</div>` : ""}</div>`;
    if (c.kind === "event") return `<div class="card"><div class="kind">${c.source === "luma" ? "Luma event" : "Calendar"}</div>
      <div><b>${esc(c.title)}</b></div><div class="meta">${day(c.start)} ${hm(c.start)}–${hm(c.end)}${c.location ? " · " + esc(c.location) : ""}</div></div>`;
    if (c.kind === "flight") return `<div class="card"><div class="kind">Flight</div>
      <div class="big">${esc(c.from)} → ${esc(c.to)}</div>
      <div>${esc(c.flight_number)} · ${day(c.departure)} ${hm(c.departure)} → ${hm(c.arrival)}</div>
      ${c.booking_ref ? `<div class="meta">Booking ${esc(c.booking_ref)}</div>` : ""}</div>`;
    return `<div class="card"><pre>${esc(JSON.stringify(c, null, 2))}</pre></div>`;
  }).join("");
}

connect();
</script>
</body>
</html>
