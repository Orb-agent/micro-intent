<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbs</title>
<link rel="icon" type="image/png" href="/static/orbs-icon-light.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="/static/orbs-icon-dark.png" media="(prefers-color-scheme: dark)">
<!--
  Desktop and Chrome extension client for the /ws protocol in docs/contracts.md:
  text, microphone, mascot voice, screen sharing and cards. Open the Chrome extension
  and launch this desktop UI from the configured backend.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --panel: #fff; --ink: #171717; --muted: #666; --line: #dedede;
    --red: #111; --listening: #111; --thinking: #111; --searching: #111; --speaking: #111;
    --orb-bg: #fff; --orb-ink: #111;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --panel: #1a1a1a; --ink: #f5f5f5; --muted: #aaa; --line: #383838; --orb-bg: #050505; --orb-ink: #fff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { width: min(100%, 1040px); min-height: 100svh; margin: 0 auto; padding: 28px 24px 36px; display: grid; grid-template-rows: auto minmax(430px, 1fr) auto auto; gap: 22px; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  h1 { font-size: 19px; letter-spacing: -.02em; margin: 0; }
  .wordmark { display: inline-flex; align-items: center; gap: 9px; }
  .wordmark svg { width: 28px; height: 28px; color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, select, input { font: inherit; color: inherit; }
  button { min-height: 44px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px;
           padding: 10px 16px; cursor: pointer; transition: transform 120ms cubic-bezier(.4,0,.2,1), background 120ms cubic-bezier(.4,0,.2,1); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  select { min-height: 44px; padding: 10px 32px 10px 13px; border: 1px solid var(--line); border-radius: 12px; background-color: var(--panel); color: var(--ink); }
  .top-controls { justify-content: flex-end; gap: 9px; }
  .top-controls button { min-height: 44px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; white-space: nowrap; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #bd8c36; }
  .pill.ok { color: var(--ink); border-color: var(--line); }
  .pill.ok::before { background: #4d9a70; }
  .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 38px 22px; border: 1px solid var(--line); border-radius: 24px; background: var(--bg); text-align: center; }
  .stage-intro { margin-bottom: 13px; }
  .eyebrow { margin: 0 0 10px; color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .15em; text-transform: uppercase; }
  .stage h2 { margin: 0; font-size: clamp(25px, 3vw, 34px); line-height: 1.15; letter-spacing: -.045em; font-weight: 570; }
  .stage-subtitle { margin: 10px 0 0; color: var(--muted); }
  #orb { display: grid; place-items: center; width: 64px; height: 64px; flex: 0 0 auto; border-radius: 50%;
         border: 0; background: transparent; color: var(--orb-ink); padding: 0;
         transition: transform .15s; touch-action: none; }
  #orb svg { width: 88%; height: 88%; filter: drop-shadow(0 0 12px color-mix(in srgb, currentColor 10%, transparent)); }
  #orb:active { transform: scale(.96); }
  #orb[data-state="listening"] { animation: orbs-listen 2.6s ease-in-out infinite; }
  #orb[data-state="thinking"] { animation: orbs-think 4.5s linear infinite; }
  #orb[data-state="searching"] { animation: orbs-act 2.2s cubic-bezier(.2,.7,.2,1) infinite; }
  #orb[data-state="speaking"] svg { animation: breathe .7s ease-in-out infinite; }
  #orb[data-state="idle"] svg { animation: idlePulse 4s ease-in-out infinite; }
  @keyframes orbs-listen { 0%,100% { transform: scale(.9); } 16% { transform: scale(1.16); } 32% { transform: scale(.94); } 47% { transform: scale(1.08); } 61% { transform: scale(.88); } 78% { transform: scale(1.2); } 90% { transform: scale(.97); } }
  @keyframes orbs-think { to { transform: rotate(360deg); } }
  @keyframes orbs-act { 0% { transform: rotate(0) scale(1); } 22% { transform: rotate(120deg) scale(1.12); } 34% { transform: rotate(120deg) scale(1); } 56% { transform: rotate(240deg) scale(1.12); } 68% { transform: rotate(240deg) scale(1); } 90% { transform: rotate(360deg) scale(1.12); } 100% { transform: rotate(360deg) scale(1); } }
  @keyframes breathe { 50% { transform: scale(.9); opacity: .68; } }
  @keyframes idlePulse { 50% { transform: scale(.96); opacity: .8; } }
  @media (prefers-reduced-motion: reduce) { #orb, #orb svg { animation: none !important; transform: none !important; } }
  #label { color: var(--ink); min-height: 1.4em; font-weight: 550; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; }
  .bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 20px; }
  .you { color: var(--muted); padding: 0 4px; }
  #you:empty, #cards:empty { display: none; }
  #cards { display: grid; gap: 12px; width: min(100%, 400px); justify-self: center; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 20px; display: grid; gap: 8px; }
  .card .kind { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .card .big { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .card .meta { color: var(--muted); }
  .badge { display: inline-block; background: var(--red); color: #fff; border-radius: 6px; padding: 0 6px; font-weight: 600; }
  .verdict-fits { color: var(--listening); } .verdict-tight { color: var(--searching); } .verdict-clash { color: var(--red); }
  #screenThumb { max-width: 160px; border-radius: 8px; border: 1px solid var(--line); display: none; }
  #log { width: min(100%, 400px); justify-self: center; font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); white-space: pre-wrap;
         max-height: 180px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  #log[hidden] { display: none; }
  form { display: flex; gap: 9px; padding: 9px; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); transition: box-shadow 200ms cubic-bezier(.4,0,.2,1); }
  form:focus-within { box-shadow: 0 0 0 2px var(--ink); }
  form input { flex: 1; min-width: 0; min-height: 48px; border: 0; outline: 0; background: transparent; border-radius: 14px; padding: 8px 14px; }
  form input::placeholder { color: var(--muted); opacity: .8; }
  form button { min-width: 86px; border: 0; background: var(--ink); color: var(--bg); font-weight: 600; }
  form button:hover { opacity: .82; }
  @media (max-width: 640px) {
    main { min-height: 100svh; padding: 16px 14px 24px; grid-template-rows: auto minmax(390px, 1fr) auto auto; gap: 14px; }
    header { align-items: flex-start; }
    .top-controls { justify-content: flex-start; width: 100%; }
    .top-controls button, .top-controls select { font-size: 12px; }
    .stage { border-radius: 22px; padding: 28px 14px; }
    #orb { width: 64px; height: 64px; }
    form { padding: 6px; }
    form input { min-height: 44px; padding-inline: 9px; }
    form button { min-width: 72px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="wordmark"><svg id="brandMark" viewBox="0 0 100 100" aria-hidden="true"></svg><h1>Orbs</h1></div>
    <div class="row top-controls">
      <span id="conn" class="pill">disconnected</span>
      <select id="mode" title="Voice mode">
        <option value="ptt">Push to talk</option>
        <option value="handsfree">Hands-free (use headphones)</option>
      </select>
      <button id="share">Share screen</button>
      <button id="sendScreen" disabled>Send screen now</button>
    </div>
  </header>

  <section class="stage">
    <div class="stage-intro"><p class="eyebrow">Orbs · personal assistant</p><h2>What’s on your mind?</h2><p class="stage-subtitle">Talk naturally, or type a question below.</p></div>
    <button id="orb" data-state="idle" aria-label="Enable microphone, then hold to talk"></button>
    <div id="label"></div>
    <div class="hint" id="hint">Select the orb to enable your microphone. Then hold it, or hold Space, while you talk.</div>
  </section>

  <div class="row"><img id="screenThumb" alt="Last screen frame sent"><span id="screenSummary" class="pill" hidden></span></div>
  <div id="you" class="you"></div>
  <div id="say" class="bubble" hidden></div>
  <div id="cards"></div>

  <form id="textForm"><input id="text" aria-label="Your question" placeholder="Ask Orbs anything…" autocomplete="off"><button>Send</button></form>
  <div id="log" hidden></div>
</main>

<script>
"use strict";
const RATE = 24000, CHUNK = 1920; // 80 ms of 24 kHz mono, contracts § Audio
const $ = (id) => document.getElementById(id);
function orbMark() {
  const ticks = Array.from({ length: 48 }, (_, i) =>
    `<rect x="48" y="4" width="4" height="10" rx="2" transform="rotate(${i * 7.5} 50 50)"/>`
  ).join("");
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="currentColor">${ticks}</g></svg>`;
}
$("orb").innerHTML = orbMark();
$("brandMark").innerHTML = orbMark().replace('<svg viewBox="0 0 100 100" aria-hidden="true">', '<g>').replace('</svg>', '</g>');
const log = (...a) => { const l = $("log"); l.hidden = false; l.textContent += a.join(" ") + "\n"; l.scrollTop = l.scrollHeight; };

let token = "", server = "";
let ws, ctx, micNode, screenStream, screenVideo;
let mode = "ptt", talking = false, serverState = "idle", dropAudio = false;
let playing = [], nextTime = 0, releasedAt = 0, firstAudioLogged = true;

// ---------- WebSocket ----------
function connect() {
  const endpoint = new URL("/ws", server);
  endpoint.protocol = endpoint.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(endpoint);
  ws.onopen = () => ws.send(JSON.stringify({ type: "hello", token, mode }));
  ws.onclose = (e) => {
    setConn(e.code === 1008 ? "invalid token" : "reconnecting", false);
    if (e.code === 1008) { $("label").textContent = "The backend rejected its configured credentials. Check the backend environment configuration."; return; }
    $("label").textContent = `Waiting for backend at ${new URL(server).host}…`;
    setTimeout(connect, 1000);
  };
  ws.onmessage = (e) => onMessage(JSON.parse(e.data));
}
const send = (m) => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));
function setConn(text, ok) { $("conn").textContent = text; $("conn").classList.toggle("ok", ok); }

function onMessage(m) {
  switch (m.type) {
    case "ready": setConn(mode === "handsfree" ? "connected · hands-free" : "connected", true); $("label").textContent = "Ready when you are"; break;
    case "state":
      serverState = m.state; $("label").textContent = m.label || "";
      if (m.state === "listening" && mode === "handsfree") { stopPlayback(); grabScreen("speech"); }
      renderOrb(); break;
    case "transcript": $("you").textContent = "You: " + m.text; log("transcript", JSON.stringify(m.text)); break;
    case "reply":
      dropAudio = false; firstAudioLogged = false;
      $("say").hidden = false; $("say").textContent = m.say; renderCards(m.cards || []); break;
    case "a2ui": log("a2ui", m.messages.length, "messages (rendered from reply.cards here)"); break;
    case "audio": if (!dropAudio) playChunk(m.data); break;
    case "audio_end": break;
    case "screen_ok":
      $("screenSummary").hidden = false;
      $("screenSummary").textContent = m.summary ? "Sees: " + m.summary : "Screen received (not read)";
      log("screen_ok", m.summary || "(no summary)"); break;
    case "error": log("error", m.message); $("label").textContent = m.message; break;
  }
}

// ---------- Audio in ----------
const WORKLET = `class Pcm extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Int16Array(${CHUNK}); this.n = 0; }
  process(inputs) {
    const ch = inputs[0][0]; if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      const s = Math.max(-1, Math.min(1, ch[i]));
      this.buf[this.n++] = s < 0 ? s * 0x8000 : s * 0x7fff;
      if (this.n === this.buf.length) { this.port.postMessage(this.buf.buffer, [this.buf.buffer]); this.buf = new Int16Array(${CHUNK}); this.n = 0; }
    }
    return true;
  }
}
registerProcessor("pcm", Pcm);`;

function ensureCtx() { // needs a user gesture (click, key, submit) before audio can play
  if (!ctx) ctx = new AudioContext({ sampleRate: RATE }); // the browser resamples the mic to 24 kHz
  if (ctx.state === "suspended") ctx.resume();
}

async function startAudio() {
  ensureCtx();
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" })));
  const mic = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
  });
  micNode = new AudioWorkletNode(ctx, "pcm");
  micNode.port.onmessage = (e) => { if (talking || mode === "handsfree") send({ type: "audio", data: b64(e.data) }); };
  ctx.createMediaStreamSource(mic).connect(micNode);
  $("hint").textContent = mode === "handsfree"
    ? "Hands-free: just talk. Talking over the beaver interrupts it."
    : "Hold the orb or Space while you talk. Click the orb while it speaks to stop it.";
  log("mic on at", ctx.sampleRate, "Hz");
}

function b64(buf) {
  const bytes = new Uint8Array(buf); let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

// ---------- Audio out ----------
function playChunk(data) {
  if (!ctx) return;
  const raw = atob(data), n = raw.length >> 1, f = new Float32Array(n);
  for (let i = 0; i < n; i++) { const v = raw.charCodeAt(2 * i) | (raw.charCodeAt(2 * i + 1) << 8); f[i] = (v > 32767 ? v - 65536 : v) / 32768; }
  const buf = ctx.createBuffer(1, n, RATE); buf.copyToChannel(f, 0);
  const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination);
  nextTime = Math.max(nextTime, ctx.currentTime + 0.03);
  src.start(nextTime); nextTime += buf.duration;
  playing.push(src); src.onended = () => { playing = playing.filter((s) => s !== src); renderOrb(); };
  if (!firstAudioLogged && releasedAt) { firstAudioLogged = true; log(`first audio ${((performance.now() - releasedAt) / 1000).toFixed(2)} s after release`); }
  renderOrb();
}

function stopPlayback() {
  dropAudio = true; // contracts § WebSocket: drop audio until the next reply
  for (const s of playing) { try { s.stop(); } catch {} }
  playing = []; nextTime = 0; renderOrb();
}

function renderOrb() {
  const state = playing.length ? "speaking" : talking ? "listening" : serverState;
  $("orb").dataset.state = state;
}

// ---------- Push to talk ----------
async function press() {
  if (!micNode) { await startAudio(); return; }      // first click only turns the mic on
  if (mode === "handsfree") { if (playing.length) { stopPlayback(); send({ type: "interrupt" }); } return; }
  if (talking) return;
  if (playing.length || serverState !== "idle") stopPlayback(); // the first audio frame interrupts server-side
  talking = true; renderOrb(); grabScreen("press");
}
function release() {
  if (!talking) return;
  talking = false; releasedAt = performance.now(); send({ type: "audio_end" }); renderOrb();
}
$("orb").addEventListener("pointerdown", (e) => { e.preventDefault(); press(); });
for (const ev of ["pointerup", "pointerleave", "pointercancel"]) $("orb").addEventListener(ev, release);
addEventListener("keydown", (e) => { if (e.code === "Space" && !e.repeat && document.activeElement !== $("text")) { e.preventDefault(); press(); } });
addEventListener("keyup", (e) => { if (e.code === "Space" && document.activeElement !== $("text")) { e.preventDefault(); release(); } });

$("mode").addEventListener("change", () => {
  mode = $("mode").value; stopPlayback(); talking = false;
  if (ws) { ws.onclose = null; ws.close(); } connect();
  if (micNode) $("hint").textContent = mode === "handsfree" ? "Hands-free: just talk." : "Hold the orb or Space while you talk.";
});

// ---------- Screen ----------
$("share").addEventListener("click", async () => {
  try {
    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 2 }, audio: false });
    screenVideo = Object.assign(document.createElement("video"), { srcObject: screenStream, muted: true });
    await screenVideo.play();
    screenStream.getVideoTracks()[0].onended = () => { screenStream = null; $("share").textContent = "Share screen"; $("sendScreen").disabled = true; };
    $("share").textContent = "Sharing ✓"; $("sendScreen").disabled = false;
    log("screen sharing on: a frame goes with each question");
  } catch (e) { log("screen share cancelled:", e.message); }
});
$("sendScreen").addEventListener("click", () => grabScreen("button"));

let lastGrab = 0;
function grabScreen(why) {
  if (!screenVideo || !screenVideo.videoWidth || performance.now() - lastGrab < 1500) return;
  lastGrab = performance.now();
  const scale = Math.min(1, 1280 / screenVideo.videoWidth);
  const c = Object.assign(document.createElement("canvas"), {
    width: Math.round(screenVideo.videoWidth * scale), height: Math.round(screenVideo.videoHeight * scale) });
  c.getContext("2d").drawImage(screenVideo, 0, 0, c.width, c.height);
  const url = c.toDataURL("image/jpeg", 0.8);
  $("screenThumb").src = url; $("screenThumb").style.display = "block";
  send({ type: "screen", mime: "image/jpeg", data: url.split(",")[1] });
  log(`screen frame sent (${why}, ${c.width}x${c.height}, ${Math.round(url.length * 0.75 / 1024)} KB)`);
}

// ---------- Text ----------
$("textForm").addEventListener("submit", (e) => {
  e.preventDefault(); const t = $("text").value.trim(); if (!t) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) { $("label").textContent = "Waiting for the backend. Keep it running, then try again."; return; }
  if (!ws || ws.readyState !== WebSocket.OPEN) { $("label").textContent = "Waiting for the backend. Keep it running, then try again."; return; }
  ensureCtx(); stopPlayback(); grabScreen("text"); releasedAt = performance.now();
  send({ type: "text", text: t }); $("you").textContent = "You: " + t; $("text").value = "";
});

// ---------- Cards (from reply.cards; the iPhone app renders the a2ui messages instead) ----------
const hm = (iso) => iso ? new Date(iso).toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Zurich" }) : "";
const day = (iso) => iso ? new Date(iso).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "Europe/Zurich" }) : "";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function renderCards(cards) {
  $("cards").innerHTML = cards.map((c) => {
    if (c.kind === "train") return `<div class="card"><div class="kind">Train</div>
      <div class="big">${hm(c.departure)} → ${hm(c.arrival)}</div>
      <div>${esc(c.line)} · ${esc(c.from)} → ${esc(c.to)}</div>
      <div class="meta">${c.platform ? `Platform <span class="badge">${esc(c.platform)}</span> · ` : ""}${c.transfers ? c.transfers + " change(s)" : "direct"}${c.delay_min ? ` · <span class="verdict-clash">+${c.delay_min} min</span>` : ""}</div></div>`;
    if (c.kind === "conflict") return `<div class="card"><div class="kind">Plan check · <span class="verdict-${esc(c.verdict)}">${esc(c.verdict)}</span></div>
      <div><b>${esc(c.event?.title)}</b> ${day(c.event?.start)} ${hm(c.event?.start)}–${hm(c.event?.end)}</div>
      <div><b>${esc(c.proposal?.title)}</b> ${day(c.proposal?.start)} ${hm(c.proposal?.start)}${c.proposal?.place ? " · " + esc(c.proposal.place) : ""}</div>
      ${c.note ? `<div class="meta">${esc(c.note)}</div>` : ""}</div>`;
    if (c.kind === "event") return `<div class="card"><div class="kind">${c.source === "luma" ? "Luma event" : "Calendar"}</div>
      <div><b>${esc(c.title)}</b></div><div class="meta">${day(c.start)} ${hm(c.start)}–${hm(c.end)}${c.location ? " · " + esc(c.location) : ""}</div></div>`;
    if (c.kind === "flight") return `<div class="card"><div class="kind">Flight</div>
      <div class="big">${esc(c.from)} → ${esc(c.to)}</div>
      <div>${esc(c.flight_number)} · ${day(c.departure)} ${hm(c.departure)} → ${hm(c.arrival)}</div>
      ${c.booking_ref ? `<div class="meta">Booking ${esc(c.booking_ref)}</div>` : ""}</div>`;
    return `<div class="card"><pre>${esc(JSON.stringify(c, null, 2))}</pre></div>`;
  }).join("");
}

async function start() {
  try { localStorage.removeItem("beaverToken"); } catch {}
  try {
    const response = await fetch("/extension-config", { cache: "no-store" });
    if (!response.ok) throw new Error(`Configuration unavailable (${response.status})`);
    const config = await response.json();
    if (typeof config.app_token !== "string" || !config.app_token || typeof config.backend_url !== "string") {
      throw new Error("Backend configuration is incomplete");
    }
    token = config.app_token;
    server = config.backend_url;
    connect();
  } catch {
    setConn("configuration unavailable", false);
    $("label").textContent = "Start the Orbs backend to connect.";
  }
}
start();
</script>
</body>
</html>
