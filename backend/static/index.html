<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Micro Intent · Beaver</title>
<!--
  Mac prototype client for the /ws protocol in docs/contracts.md: mic, screen sharing,
  mascot voice and cards. Stands in for the iPhone app (WP1) so the idea can be tried on
  a Mac. Open http://localhost:8000/#token=<APP_TOKEN> in desktop Chrome.
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d12; --bg-raised: #141826; --panel: rgb(26 28 36 / .84);
    --ink: #f7f8fb; --muted: #a9afbf; --line: rgb(255 255 255 / .1);
    --accent: #3d63ff; --accent-bright: #6fb8ff; --success: #4ade80;
    --warning: #fcd34d; --danger: #fca5a5;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    min-height: 100vh; margin: 0; color: var(--ink);
    background: radial-gradient(ellipse at 50% 22%, #17254a 0, transparent 38%),
      linear-gradient(180deg, var(--bg) 0%, #101522 100%);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  main { width: min(100% - 40px, 940px); min-height: 100vh; margin: 0 auto; padding: 28px 0 36px; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; min-width: max-content; }
  .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid rgb(111 184 255 / .34); border-radius: 13px; color: #b9d8ff; background: linear-gradient(145deg, #1b3bd1, #3d63ff 62%, #6fb8ff); box-shadow: 0 5px 22px rgb(61 99 255 / .28); }
  .brand-mark svg { width: 21px; height: 21px; }
  h1 { margin: 0; font-size: 16px; line-height: 1.2; font-weight: 650; letter-spacing: -.02em; }
  .brand-caption { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .row, .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button, select, input { font: inherit; color: inherit; }
  button, select { min-height: 42px; border: 1px solid var(--line); background: rgb(255 255 255 / .055); border-radius: 13px; padding: 8px 14px; cursor: pointer; transition: background .18s, border-color .18s, transform .18s; }
  button:hover:not(:disabled), select:hover { border-color: rgb(157 187 255 / .38); background: rgb(255 255 255 / .09); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .42; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #6fb8ff; outline-offset: 3px; }
  select { max-width: 230px; color: #dce5ff; }
  option { color: #f7f8fb; background: #141826; }
  .pill { display: inline-flex; align-items: center; gap: 7px; min-height: 32px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; background: rgb(255 255 255 / .04); font-size: 12px; }
  #conn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #737b8e; }
  .pill.ok { color: var(--success); border-color: rgb(74 222 128 / .24); background: rgb(34 197 94 / .08); }
  .pill.ok::before { background: var(--success); box-shadow: 0 0 10px rgb(74 222 128 / .6); }
  .stage { flex: 1; display: grid; align-content: center; justify-items: center; gap: 16px; min-height: 400px; padding: 28px 0 32px; text-align: center; }
  .eyebrow { margin: 0; color: #9dbbff; font-size: 11px; font-weight: 650; letter-spacing: .18em; text-transform: uppercase; }
  #orb { position: relative; isolation: isolate; display: grid; place-items: center; width: 156px; height: 156px; margin: 8px 0 4px; padding: 0; border: 1px solid rgb(255 255 255 / .5); border-radius: 50%; color: #14358d; background: radial-gradient(circle at 33% 25%, #fff 0%, #cff4ff 14%, #6fb8ff 39%, #3d63ff 67%, #1b3bd1 100%); box-shadow: inset -10px -15px 24px rgb(10 20 90 / .45), inset 6px 7px 15px rgb(255 255 255 / .78), 0 0 60px rgb(62 139 255 / .34), 0 18px 54px rgb(0 0 0 / .3); transition: transform .25s, filter .25s, box-shadow .25s; touch-action: none; }
  #orb::before, #orb::after { content: ""; position: absolute; z-index: -1; border: 1px solid rgb(157 187 255 / .24); border-radius: 50%; pointer-events: none; }
  #orb::before { inset: -13px; }
  #orb::after { inset: -25px; border-color: rgb(157 187 255 / .11); }
  #orb:hover { filter: brightness(1.08); transform: scale(1.025); }
  #orb:active { transform: scale(.96); }
  #orb svg { width: 31px; height: 31px; filter: drop-shadow(0 2px 5px rgb(255 255 255 / .45)); }
  #orb[data-state="listening"] { animation: listen 1.25s ease-in-out infinite; }
  #orb[data-state="thinking"], #orb[data-state="searching"] { animation: think 2.8s linear infinite; }
  #orb[data-state="speaking"] { animation: speak .8s ease-in-out infinite alternate; }
  #orb[data-state="listening"]::before, #orb[data-state="speaking"]::before { border-color: rgb(111 184 255 / .6); }
  @keyframes listen { 50% { box-shadow: inset -10px -15px 24px rgb(10 20 90 / .4), inset 6px 7px 15px rgb(255 255 255 / .8), 0 0 0 12px rgb(61 99 255 / .12), 0 0 72px rgb(62 139 255 / .62); } }
  @keyframes think { to { filter: hue-rotate(45deg); } }
  @keyframes speak { to { transform: scale(1.045); box-shadow: inset -10px -15px 24px rgb(10 20 90 / .4), inset 6px 7px 15px rgb(255 255 255 / .8), 0 0 72px rgb(62 139 255 / .65), 0 0 0 9px rgb(61 99 255 / .1); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  #label { min-height: 1.5em; color: #b9d8ff; font-size: 14px; font-weight: 550; }
  .hint { max-width: 410px; margin: 0; color: var(--muted); font-size: 13px; }
  .content { width: min(100%, 700px); margin: 0 auto; display: grid; gap: 12px; }
  .bubble { background: linear-gradient(135deg, rgb(61 99 255 / .12), rgb(255 255 255 / .045)); border: 1px solid rgb(111 184 255 / .18); border-radius: 18px; padding: 15px 18px; box-shadow: 0 12px 32px rgb(0 0 0 / .12); }
  .you { color: var(--muted); font-size: 13px; }
  #screenRow { min-height: 0; }
  #cards { display: grid; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; display: grid; gap: 5px; box-shadow: 0 12px 32px rgb(0 0 0 / .12); backdrop-filter: blur(18px); }
  .card .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: #9dbbff; }
  .card .big { font-size: 27px; font-weight: 650; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
  .card .meta { color: var(--muted); }
  .badge { display: inline-block; background: rgb(61 99 255 / .2); color: #c9d8ff; border-radius: 7px; padding: 0 7px; font-weight: 600; }
  .verdict-fits { color: var(--success); } .verdict-tight { color: var(--warning); } .verdict-clash { color: var(--danger); }
  #screenThumb { max-width: 120px; border-radius: 12px; border: 1px solid var(--line); display: none; }
  #screenSummary { max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #textForm { display: flex; gap: 9px; padding: 7px; border: 1px solid var(--line); border-radius: 17px; background: rgb(255 255 255 / .055); box-shadow: 0 14px 36px rgb(0 0 0 / .18); }
  #textForm input { flex: 1; min-width: 0; min-height: 42px; border: 0; outline: 0; background: transparent; padding: 7px 12px; }
  #textForm input::placeholder { color: #81899d; }
  #textForm button { min-width: 78px; border-color: transparent; color: white; background: linear-gradient(135deg, #3d63ff, #2448f5); font-weight: 600; }
  #textForm button:hover { background: linear-gradient(135deg, #5878ff, #3157ff); }
  #logDetails { margin-top: 16px; color: #858da1; font-size: 12px; }
  #logDetails summary { width: max-content; cursor: pointer; user-select: none; }
  #log { margin-top: 8px; font: 11px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; max-height: 150px; overflow: auto; background: rgb(0 0 0 / .2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  @media (max-width: 680px) { main { width: min(100% - 28px, 940px); padding-top: 17px; } header { align-items: flex-start; flex-direction: column; } .toolbar { width: 100%; } .toolbar > * { flex: 1; } .toolbar select { max-width: none; } .stage { min-height: 360px; } #orb { width: 136px; height: 136px; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12c2.2-4.5 5.1-6.8 8.7-6.8 3.1 0 5.2 1.5 7.3 4.4M4 12c2.2 4.5 5.1 6.8 8.7 6.8 3.1 0 5.2-1.5 7.3-4.4M4 12h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div>
      <div><h1>Micro Intent</h1><span class="brand-caption">Beaver voice companion</span></div>
    </div>
    <div class="toolbar">
      <span id="conn" class="pill">disconnected</span>
      <select id="mode" title="Voice mode">
        <option value="ptt">Push to talk</option>
        <option value="handsfree">Hands-free (use headphones)</option>
      </select>
      <button id="share">Share screen</button>
      <button id="sendScreen" disabled>Send screen now</button>
    </div>
  </header>

  <section class="stage" aria-label="Voice assistant">
    <p class="eyebrow">Your day, in the moment</p>
    <button id="orb" data-state="idle" aria-label="Hold to talk" title="Hold to talk">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3m-4 0h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div id="label"></div>
    <p class="hint" id="hint">Tap the orb to enable your microphone. Then hold it, or hold Space, while you talk.</p>
  </section>

  <section class="content" aria-live="polite">
    <div class="row" id="screenRow"><img id="screenThumb" alt="Last screen frame sent"><span id="screenSummary" class="pill" hidden></span></div>
    <div id="you" class="you"></div>
    <div id="say" class="bubble" hidden></div>
    <div id="cards"></div>

    <form id="textForm"><input id="text" aria-label="Type a question" placeholder="Ask Beaver anything…" autocomplete="off"><button>Send</button></form>
  </section>
  <details id="logDetails"><summary>Connection details</summary><div id="log"></div></details>
</main>

<script>
"use strict";
const RATE = 24000, CHUNK = 1920; // 80 ms of 24 kHz mono, contracts § Audio
const $ = (id) => document.getElementById(id);
const log = (...a) => { const l = $("log"); l.textContent += a.join(" ") + "\n"; l.scrollTop = l.scrollHeight; };

// Token: from #token=... once, then remembered.
let token = new URLSearchParams(location.hash.slice(1)).get("token");
try {
  if (token) { localStorage.setItem("beaverToken", token); history.replaceState(null, "", location.pathname); }
  else token = localStorage.getItem("beaverToken");
} catch {}
if (!token) token = prompt("APP_TOKEN (from backend/.env)") || "";

let ws, ctx, micNode, screenStream, screenVideo;
let mode = "ptt", talking = false, serverState = "idle", dropAudio = false;
let playing = [], nextTime = 0, releasedAt = 0, firstAudioLogged = true;

// ---------- WebSocket ----------
function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onopen = () => ws.send(JSON.stringify({ type: "hello", token, mode }));
  ws.onclose = (e) => {
    setConn(e.code === 1008 ? "bad token" : "disconnected", false);
    if (e.code === 1008) { try { localStorage.removeItem("beaverToken"); } catch {} return; }
    setTimeout(connect, 1000);
  };
  ws.onmessage = (e) => onMessage(JSON.parse(e.data));
}
const send = (m) => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));
function setConn(text, ok) { $("conn").textContent = text; $("conn").classList.toggle("ok", ok); }

function onMessage(m) {
  switch (m.type) {
    case "ready": setConn(mode === "handsfree" ? "connected · hands-free" : "connected", true); break;
    case "state":
      serverState = m.state; $("label").textContent = m.label || "";
      if (m.state === "listening" && mode === "handsfree") { stopPlayback(); grabScreen("speech"); }
      renderOrb(); break;
    case "transcript": $("you").textContent = "You: " + m.text; log("transcript", JSON.stringify(m.text)); break;
    case "reply":
      dropAudio = false; firstAudioLogged = false;
      $("say").hidden = false; $("say").textContent = m.say; renderCards(m.cards || []); break;
    case "a2ui": log("a2ui", m.messages.length, "messages (rendered from reply.cards here)"); break;
    case "audio": if (!dropAudio) playChunk(m.data); break;
    case "audio_end": break;
    case "screen_ok":
      $("screenSummary").hidden = false;
      $("screenSummary").textContent = m.summary ? "Sees: " + m.summary : "Screen received (not read)";
      log("screen_ok", m.summary || "(no summary)"); break;
    case "error": log("error", m.message); $("label").textContent = m.message; break;
  }
}

// ---------- Audio in ----------
const WORKLET = `class Pcm extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Int16Array(${CHUNK}); this.n = 0; }
  process(inputs) {
    const ch = inputs[0][0]; if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      const s = Math.max(-1, Math.min(1, ch[i]));
      this.buf[this.n++] = s < 0 ? s * 0x8000 : s * 0x7fff;
      if (this.n === this.buf.length) { this.port.postMessage(this.buf.buffer, [this.buf.buffer]); this.buf = new Int16Array(${CHUNK}); this.n = 0; }
    }
    return true;
  }
}
registerProcessor("pcm", Pcm);`;

function ensureCtx() { // needs a user gesture (click, key, submit) before audio can play
  if (!ctx) ctx = new AudioContext({ sampleRate: RATE }); // the browser resamples the mic to 24 kHz
  if (ctx.state === "suspended") ctx.resume();
}

async function startAudio() {
  ensureCtx();
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" })));
  const mic = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
  });
  micNode = new AudioWorkletNode(ctx, "pcm");
  micNode.port.onmessage = (e) => { if (talking || mode === "handsfree") send({ type: "audio", data: b64(e.data) }); };
  ctx.createMediaStreamSource(mic).connect(micNode);
  $("hint").textContent = mode === "handsfree"
    ? "Hands-free: just talk. Talking over the beaver interrupts it."
    : "Hold the orb or Space while you talk. Click the orb while it speaks to stop it.";
  log("mic on at", ctx.sampleRate, "Hz");
}

function b64(buf) {
  const bytes = new Uint8Array(buf); let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

// ---------- Audio out ----------
function playChunk(data) {
  if (!ctx) return;
  const raw = atob(data), n = raw.length >> 1, f = new Float32Array(n);
  for (let i = 0; i < n; i++) { const v = raw.charCodeAt(2 * i) | (raw.charCodeAt(2 * i + 1) << 8); f[i] = (v > 32767 ? v - 65536 : v) / 32768; }
  const buf = ctx.createBuffer(1, n, RATE); buf.copyToChannel(f, 0);
  const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination);
  nextTime = Math.max(nextTime, ctx.currentTime + 0.03);
  src.start(nextTime); nextTime += buf.duration;
  playing.push(src); src.onended = () => { playing = playing.filter((s) => s !== src); renderOrb(); };
  if (!firstAudioLogged && releasedAt) { firstAudioLogged = true; log(`first audio ${((performance.now() - releasedAt) / 1000).toFixed(2)} s after release`); }
  renderOrb();
}

function stopPlayback() {
  dropAudio = true; // contracts § WebSocket: drop audio until the next reply
  for (const s of playing) { try { s.stop(); } catch {} }
  playing = []; nextTime = 0; renderOrb();
}

function renderOrb() {
  const state = playing.length ? "speaking" : talking ? "listening" : serverState;
  $("orb").dataset.state = state;
}

// ---------- Push to talk ----------
async function press() {
  if (!micNode) { await startAudio(); return; }      // first click only turns the mic on
  if (mode === "handsfree") { if (playing.length) { stopPlayback(); send({ type: "interrupt" }); } return; }
  if (talking) return;
  if (playing.length || serverState !== "idle") stopPlayback(); // the first audio frame interrupts server-side
  talking = true; renderOrb(); grabScreen("press");
}
function release() {
  if (!talking) return;
  talking = false; releasedAt = performance.now(); send({ type: "audio_end" }); renderOrb();
}
$("orb").addEventListener("pointerdown", (e) => { e.preventDefault(); press(); });
for (const ev of ["pointerup", "pointerleave", "pointercancel"]) $("orb").addEventListener(ev, release);
addEventListener("keydown", (e) => { if (e.code === "Space" && !e.repeat && document.activeElement !== $("text")) { e.preventDefault(); press(); } });
addEventListener("keyup", (e) => { if (e.code === "Space" && document.activeElement !== $("text")) { e.preventDefault(); release(); } });

$("mode").addEventListener("change", () => {
  mode = $("mode").value; stopPlayback(); talking = false;
  if (ws) { ws.onclose = null; ws.close(); } connect();
  if (micNode) $("hint").textContent = mode === "handsfree" ? "Hands-free: just talk." : "Hold the orb or Space while you talk.";
});

// ---------- Screen ----------
$("share").addEventListener("click", async () => {
  try {
    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 2 }, audio: false });
    screenVideo = Object.assign(document.createElement("video"), { srcObject: screenStream, muted: true });
    await screenVideo.play();
    screenStream.getVideoTracks()[0].onended = () => { screenStream = null; $("share").textContent = "Share screen"; $("sendScreen").disabled = true; };
    $("share").textContent = "Sharing ✓"; $("sendScreen").disabled = false;
    log("screen sharing on: a frame goes with each question");
  } catch (e) { log("screen share cancelled:", e.message); }
});
$("sendScreen").addEventListener("click", () => grabScreen("button"));

let lastGrab = 0;
function grabScreen(why) {
  if (!screenVideo || !screenVideo.videoWidth || performance.now() - lastGrab < 1500) return;
  lastGrab = performance.now();
  const scale = Math.min(1, 1280 / screenVideo.videoWidth);
  const c = Object.assign(document.createElement("canvas"), {
    width: Math.round(screenVideo.videoWidth * scale), height: Math.round(screenVideo.videoHeight * scale) });
  c.getContext("2d").drawImage(screenVideo, 0, 0, c.width, c.height);
  const url = c.toDataURL("image/jpeg", 0.8);
  $("screenThumb").src = url; $("screenThumb").style.display = "block";
  send({ type: "screen", mime: "image/jpeg", data: url.split(",")[1] });
  log(`screen frame sent (${why}, ${c.width}x${c.height}, ${Math.round(url.length * 0.75 / 1024)} KB)`);
}

// ---------- Text ----------
$("textForm").addEventListener("submit", (e) => {
  e.preventDefault(); const t = $("text").value.trim(); if (!t) return;
  ensureCtx(); stopPlayback(); grabScreen("text"); releasedAt = performance.now();
  send({ type: "text", text: t }); $("you").textContent = "You: " + t; $("text").value = "";
});

// ---------- Cards (from reply.cards; the iPhone app renders the a2ui messages instead) ----------
const hm = (iso) => iso ? new Date(iso).toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Zurich" }) : "";
const day = (iso) => iso ? new Date(iso).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "Europe/Zurich" }) : "";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function renderCards(cards) {
  $("cards").innerHTML = cards.map((c) => {
    if (c.kind === "train") return `<div class="card"><div class="kind">Train</div>
      <div class="big">${hm(c.departure)} → ${hm(c.arrival)}</div>
      <div>${esc(c.line)} · ${esc(c.from)} → ${esc(c.to)}</div>
      <div class="meta">${c.platform ? `Platform <span class="badge">${esc(c.platform)}</span> · ` : ""}${c.transfers ? c.transfers + " change(s)" : "direct"}${c.delay_min ? ` · <span class="verdict-clash">+${c.delay_min} min</span>` : ""}</div></div>`;
    if (c.kind === "conflict") return `<div class="card"><div class="kind">Plan check · <span class="verdict-${esc(c.verdict)}">${esc(c.verdict)}</span></div>
      <div><b>${esc(c.event?.title)}</b> ${day(c.event?.start)} ${hm(c.event?.start)}–${hm(c.event?.end)}</div>
      <div><b>${esc(c.proposal?.title)}</b> ${day(c.proposal?.start)} ${hm(c.proposal?.start)}${c.proposal?.place ? " · " + esc(c.proposal.place) : ""}</div>
      ${c.note ? `<div class="meta">${esc(c.note)}</div>` : ""}</div>`;
    if (c.kind === "event") return `<div class="card"><div class="kind">${c.source === "luma" ? "Luma event" : "Calendar"}</div>
      <div><b>${esc(c.title)}</b></div><div class="meta">${day(c.start)} ${hm(c.start)}–${hm(c.end)}${c.location ? " · " + esc(c.location) : ""}</div></div>`;
    if (c.kind === "flight") return `<div class="card"><div class="kind">Flight</div>
      <div class="big">${esc(c.from)} → ${esc(c.to)}</div>
      <div>${esc(c.flight_number)} · ${day(c.departure)} ${hm(c.departure)} → ${hm(c.arrival)}</div>
      ${c.booking_ref ? `<div class="meta">Booking ${esc(c.booking_ref)}</div>` : ""}</div>`;
    return `<div class="card"><pre>${esc(JSON.stringify(c, null, 2))}</pre></div>`;
  }).join("");
}

connect();
</script>
</body>
</html>
