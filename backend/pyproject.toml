[project]
name = "micro-intent-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "google-genai>=1.40",
    "gradium>=0.6.4",
    "python-dotenv>=1.0",
    "certifi>=2024.2",
    "aiohttp>=3.9",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "websockets>=13"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
