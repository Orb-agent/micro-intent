<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Micro Intent · Microphone</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: radial-gradient(1200px 600px at 50% 0%, #2a2f45, #0d0f14);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
        color: rgba(255, 255, 255, 0.92);
      }
      main {
        width: min(440px, calc(100vw - 32px)); padding: 28px; border-radius: 24px;
        background: rgba(28, 30, 36, 0.72); border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(24px); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45); text-align: center;
      }
      h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
      p { margin: 0; color: rgba(255, 255, 255, 0.66); }
      #status { margin-top: 18px; font-weight: 500; color: #fff; }
      #status.ok { color: #6ee7a8; }
      #status.err { color: #ff8a8a; }
      button {
        margin-top: 20px; height: 44px; padding: 0 22px; border-radius: 999px; border: 0;
        background: #1f4fd8; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Allow the microphone</h1>
      <p>Micro Intent listens only while you hold the orb. Audio goes to your Micro Intent backend for transcription.</p>
      <div id="status">Waiting for Chrome's prompt…</div>
      <button id="retry" hidden>Try again</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
