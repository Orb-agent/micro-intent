<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbs</title>
<!--
  Desktop and Chrome extension client for the /ws protocol in docs/contracts.md:
  text, microphone, mascot voice, screen sharing and cards. Open the Chrome extension
  and launch this desktop UI from the configured backend.
-->
<style>
  :root {
    --bg: #f6f5f2; --panel: #fff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e4e2dc;
    --red: #111; --listening: #111; --thinking: #111; --searching: #111; --speaking: #111;
    --orb-bg: #fff; --orb-ink: #111;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1f1f1d; --ink: #f1efe9; --muted: #a09d95; --line: #33322f; --orb-bg: #050505; --orb-ink: #fff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  h1 { font-size: 18px; margin: 0; }
  .wordmark { display: inline-flex; align-items: center; gap: 9px; }
  .wordmark svg { width: 28px; height: 28px; color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, select, input { font: inherit; color: inherit; }
  button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
           padding: 6px 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .pill.ok { color: var(--listening); border-color: currentColor; }
  .stage { display: grid; justify-items: center; gap: 10px; padding: 24px 0 8px; }
  #orb { display: grid; place-items: center; width: 132px; height: 132px; border-radius: 50%;
         border: 1px solid var(--line); background: var(--orb-bg); color: var(--orb-ink);
         box-shadow: 0 0 0 0 transparent; transition: transform .15s; touch-action: none; }
  #orb svg { width: 78%; height: 78%; }
  #orb:active { transform: scale(.96); }
  #orb[data-state="listening"] svg { animation: orbit 3s linear infinite; }
  #orb[data-state="thinking"] svg { animation: breathe 1.5s ease-in-out infinite; }
  #orb[data-state="searching"] svg { animation: orbit 1.5s linear infinite; }
  #orb[data-state="speaking"] svg { animation: breathe .7s ease-in-out infinite; }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @keyframes breathe { 50% { transform: scale(.9); opacity: .68; } }
  @media (prefers-reduced-motion: reduce) { #orb svg { animation: none !important; } }
  #label { color: var(--muted); min-height: 1.4em; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; }
  .bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; }
  .you { color: var(--muted); }
  #cards { display: grid; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 4px; }
  .card .kind { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .card .big { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .card .meta { color: var(--muted); }
  .badge { display: inline-block; background: var(--red); color: #fff; border-radius: 6px; padding: 0 6px; font-weight: 600; }
  .verdict-fits { color: var(--listening); } .verdict-tight { color: var(--searching); } .verdict-clash { color: var(--red); }
  #screenThumb { max-width: 160px; border-radius: 8px; border: 1px solid var(--line); display: none; }
  #log { font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); white-space: pre-wrap;
         max-height: 180px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  form { display: flex; gap: 8px; } form input { flex: 1; min-width: 0; border: 1px solid var(--line);
         background: var(--panel); border-radius: 999px; padding: 6px 14px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="wordmark"><svg id="brandMark" viewBox="0 0 100 100" aria-hidden="true"></svg><h1>Orbs</h1></div>
    <div class="row">
      <span id="conn" class="pill">disconnected</span>
      <select id="mode" title="Voice mode">
        <option value="ptt">Push to talk</option>
        <option value="handsfree">Hands-free (use headphones)</option>
      </select>
      <button id="share">Share screen</button>
      <button id="sendScreen" disabled>Send screen now</button>
    </div>
  </header>

  <section class="stage">
    <button id="orb" data-state="idle" aria-label="Hold to talk"></button>
    <div id="label"></div>
    <div class="hint" id="hint">Click the orb to start. Then hold it, or hold Space, while you talk.</div>
  </section>

  <div class="row"><img id="screenThumb" alt="Last screen frame sent"><span id="screenSummary" class="pill" hidden></span></div>
  <div id="you" class="you"></div>
  <div id="say" class="bubble" hidden></div>
  <div id="cards"></div>

  <form id="textForm"><input id="text" placeholder="Or type a question…" autocomplete="off"><button>Send</button></form>
  <div id="log"></div>
</main>

<script src="client.js"></script>
</body>
</html>
